<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://share-test123.netlify.app/share/abc123/"
    />

    <meta property="og:title" content="Great job!" />
    <meta property="og:description" content="You earned 120 XP" />

    <meta
      property="og:image"
      content="https://share-test123.netlify.app/share/abc123/image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <title>Share Page</title>
  </head>

  <body>
    <h1>Great job!</h1>
    <p>You earned 120 XP</p>
    <img
      src="/share/abc123/image.png"
      alt="preview"
      style="max-width: 100%; height: auto;"
    />
  </body>
</html>
