<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://share-test123.netlify.app/share/abc123/"
    />

    <!-- Minimal text (Duolingo style trick) -->
    <meta property="og:title" content="." />
    <meta property="og:description" content="." />

    <!-- Main preview image -->
    <meta
      property="og:image"
      content="https://share-test123.netlify.app/share/abc123/image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Optional: Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <title>Share</title>

    <style>
      body {
        margin: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: white;
        font-family: Arial, sans-serif;
      }

      img {
        width: 100%;
        max-width: 600px;
        height: auto;
      }
    </style>
  </head>

  <body>
    <!-- Fallback when opened directly -->
    <img src="/share/abc123/image.png" alt="share image" />
  </body>
</html>
